<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SPRINTGATE Pro – iOS Fixad</title>
  <style>
    :root {
      --bg: #0b0e14;
      --panel: #141923;
      --border: #242d3d;
      --text: #f0f4f8;
      --muted: #8b9bb4;
      --start: #00e676;
      --finish: #ff3d57;
      --accent: #3b82f6;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      font-size: 1rem;
      margin: 0;
      letter-spacing: 0.08em;
      font-weight: 800;
    }

    .mode-switch {
      display: flex;
      gap: 6px;
    }

    button {
      background: #1e2636;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    button:active {
      opacity: 0.85;
    }

    .viewport-wrap {
      position: relative;
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
      background: #000;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      touch-action: none;
    }

    video, canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    #overlayCanvas {
      z-index: 2;
    }

    .center-prompt {
      position: absolute;
      inset: 0;
      z-index: 4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: rgba(11, 14, 20, 0.75);
      padding: 16px;
      text-align: center;
    }

    .center-prompt.hidden {
      display: none !important;
    }

    .hud {
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      z-index: 3;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      gap: 8px;
    }

    .timer-box {
      background: rgba(11, 14, 20, 0.84);
      backdrop-filter: blur(6px);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 7px 12px;
    }

    .timer-value {
      font-size: 1.75rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
    }

    .status-badge {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }

    .meter-wrap {
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-width: 125px;
    }

    .meter-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      font-weight: 700;
    }

    .meter-bar {
      flex: 1;
      height: 6px;
      background: #1f2937;
      border-radius: 3px;
      overflow: hidden;
    }

    .meter-fill {
      height: 100%;
      width: 0%;
      transition: width 0.04s linear;
    }

    .controls {
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .btn-primary {
      background: #00c853;
      border-color: #00c853;
      color: #04130a;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .slider-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-size: 0.83rem;
    }

    .slider-row label {
      color: var(--muted);
      min-width: 135px;
    }

    input[type="range"] {
      flex: 1;
    }

    .slowmo-bar {
      display: none;
      flex-direction: column;
      gap: 10px;
    }

    .slowmo-bar.visible {
      display: flex;
    }

    .file-btn-label {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
    }

    .history-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 180px;
      overflow-y: auto;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 10px;
      background: #1a2130;
      border-radius: 8px;
      font-size: 0.9rem;
      font-variant-numeric: tabular-nums;
    }

    .pb-tag {
      color: var(--start);
      font-weight: 700;
      font-size: 0.75rem;
      margin-left: 6px;
    }

    .error-banner {
      background: rgba(255, 61, 87, 0.15);
      border: 1px solid var(--finish);
      color: #ffb3be;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      display: none;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <header>
    <h1>SPRINTGATE PRO</h1>
    <div class="mode-switch">
      <button id="btnLiveMode" class="active">Live-kamera</button>
      <button id="btnVideoMode">240 fps Video</button>
    </div>
  </header>

  <div class="viewport-wrap" id="viewport">
    <video id="videoEl" playsinline webkit-playsinline muted autoplay preload="auto"></video>
    <canvas id="overlayCanvas"></canvas>

    <!-- Startprompt krävs av iOS Safari -->
    <div class="center-prompt" id="startPrompt">
      <button id="btnStartCamBig" class="btn-primary" style="font-size:1rem; padding:12px 20px;">
        Starta kamera
      </button>
      <span id="promptSubtext" style="font-size:0.8rem; color:var(--muted);">
        Tryck för att ge webbläsaren åtkomst till kameran
      </span>
    </div>

    <div class="hud">
      <div class="timer-box">
        <div class="status-badge" id="stateLabel">Redo</div>
        <div class="timer-value" id="timerDisplay">0.000 s</div>
      </div>

      <div class="timer-box meter-wrap">
        <div class="meter-row">
          <span style="color:var(--start);width:38px;">START</span>
          <div class="meter-bar"><div class="meter-fill" id="startMeter" style="background:var(--start);"></div></div>
        </div>
        <div class="meter-row">
          <span style="color:var(--finish);width:38px;">MÅL</span>
          <div class="meter-bar"><div class="meter-fill" id="finishMeter" style="background:var(--finish);"></div></div>
        </div>
        <div class="status-badge" id="fpsInfo" style="text-align:right;">FPS: --</div>
      </div>
    </div>
  </div>

  <div class="controls">
    <div class="error-banner" id="errorBanner"></div>

    <!-- Live-kontroller -->
    <div class="btn-row" id="liveControls">
      <button id="btnArm" class="btn-primary">Aktivera (Arm)</button>
      <button id="btnReset">Nollställ</button>
      <button id="btnSwitchCam">Byt kamera</button>
    </div>

    <!-- 240 fps Video-kontroller -->
    <div class="panel slowmo-bar" id="slowmoControls">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap;">
        <label class="file-btn-label" for="videoUpload">Välj video från kamerarulle</label>
        <input type="file" id="videoUpload" accept="video/*,video/mp4,video/quicktime" style="display:none;" />

        <select id="fpsFactor" style="background:#1e2636;color:#fff;border:1px solid var(--border);border-radius:8px;padding:9px;">
          <option value="8" selected>240 fps (8× slow-mo)</option>
          <option value="4">120 fps (4× slow-mo)</option>
          <option value="1">60 / 30 fps (1× realtid)</option>
        </select>
      </div>

      <div class="slider-row">
        <label for="videoScrubber" style="min-width:95px;">Tid: <span id="videoTimeLabel">0.00 s</span></label>
        <input type="range" id="videoScrubber" min="0" max="1000" value="0" />
      </div>

      <div class="btn-row">
        <button id="btnPlayPause">Spela / Pausa</button>
        <button id="btnStepBack">-1 ruta</button>
        <button id="btnStepFwd">+1 ruta</button>
      </div>

      <div class="btn-row" style="grid-template-columns: 1fr 1fr;">
        <button id="btnArmVideo" class="btn-primary">Aktivera auto-detektering</button>
        <button id="btnResetVideo">Nollställ tid</button>
      </div>
    </div>

    <!-- Inställningar -->
    <div class="panel">
      <div class="btn-row" style="grid-template-columns: 1fr 1fr;">
        <button id="btnSwapLines">Växla Start ↔ Mål</button>
        <button id="btnRecalibrate">Lås ny bakgrund</button>
      </div>

      <div class="slider-row">
        <label for="sensSlider">Tröskelvärde: <span id="sensVal">16%</span></label>
        <input type="range" id="sensSlider" min="5" max="45" value="16" />
      </div>

      <div class="slider-row">
        <label for="contrastSlider">Kontrastkänslighet: <span id="contrastVal">28</span></label>
        <input type="range" id="contrastSlider" min="12" max="65" value="28" />
      </div>
    </div>

    <!-- Historik -->
    <div class="panel">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <strong style="font-size:0.9rem;">Sparade tider</strong>
        <button id="btnCopyTimes" style="padding:5px 10px; font-size:0.78rem;">Kopiera tider</button>
      </div>
      <ul class="history-list" id="historyList"></ul>
    </div>
  </div>

  <script>
    const video = document.getElementById('videoEl');
    const canvas = document.getElementById('overlayCanvas');
    const ctx = canvas.getContext('2d');
    const startPrompt = document.getElementById('startPrompt');
    const errorBanner = document.getElementById('errorBanner');

    const procCanvas = document.createElement('canvas');
    procCanvas.width = 640;
    procCanvas.height = 360;
    const procCtx = procCanvas.getContext('2d', { willReadFrequently: true });

    let mode = 'live';
    let facingMode = 'environment';
    let currentStream = null;
    let currentObjectUrl = null;

    // 4 fritt flyttbara punkter
    let gates = {
      start: {
        p1: { x: 0.25, y: 0.22 },
        p2: { x: 0.25, y: 0.78 },
        bgLuma: null,
        prevSignal: 0,
        flashUntil: 0
      },
      finish: {
        p1: { x: 0.75, y: 0.22 },
        p2: { x: 0.75, y: 0.78 },
        bgLuma: null,
        prevSignal: 0,
        flashUntil: 0
      }
    };

    let activeHandle = null;
    let state = 'IDLE';
    let startTimeSec = 0;
    let prevClockSec = 0;
    let lastTriggerWallMs = 0;
    const DEBOUNCE_MS = 350;

    let triggerThresholdPct = 16;
    let lumaDeltaThreshold = 28;
    const SAMPLE_COUNT = 200;
    let times = [];
    let frameTimestamps = [];

    function showError(msg) {
      if (!msg) {
        errorBanner.style.display = 'none';
        return;
      }
      errorBanner.textContent = msg;
      errorBanner.style.display = 'block';
    }

    // Ljudgenerator
    let audioCtx = null;
    function beep(freq = 880, duration = 0.1) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = freq;
        osc.type = 'sine';
        gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (_) {}
    }

    // iOS-säker kamerastart
    async function startCamera() {
      showError('');
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        showError('Kameran blockeras av webbläsaren. Kontrollera att sidan öppnas via HTTPS i Safari (inte inuti en annan app).');
        return;
      }

      if (currentStream) {
        currentStream.getTracks().forEach(t => t.stop());
        currentStream = null;
      }

      video.pause();
      video.removeAttribute('src');
      video.load();

      try {
        // Enkla, iOS-kompatibla constraints utan tvingande high-fps som kraschar Safari
        currentStream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: facingMode },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });

        video.srcObject = currentStream;
        video.muted = true;
        video.playsInline = true;
        await video.play();

        startPrompt.classList.add('hidden');
        resetBackgrounds();
        document.getElementById('stateLabel').textContent = 'Kamera aktiv';
      } catch (err) {
        console.error(err);
        startPrompt.classList.remove('hidden');
        showError(`Kamerafel (${err.name}): Kontrollera att kameran är tillåten under Inställningar → Safari → Kamera.`);
      }
    }

    function resetBackgrounds() {
      gates.start.bgLuma = null;
      gates.finish.bgLuma = null;
      gates.start.prevSignal = 0;
      gates.finish.prevSignal = 0;
    }

    function getVideoViewportRect() {
      const cw = canvas.width;
      const ch = canvas.height;
      const vw = video.videoWidth || 16;
      const vh = video.videoHeight || 9;
      const videoAspect = vw / vh;
      const canvasAspect = cw / ch;

      let renderW, renderH, offsetX, offsetY;
      if (videoAspect > canvasAspect) {
        renderW = cw;
        renderH = cw / videoAspect;
        offsetX = 0;
        offsetY = (ch - renderH) / 2;
      } else {
        renderH = ch;
        renderW = ch * videoAspect;
        offsetX = (cw - renderW) / 2;
        offsetY = 0;
      }
      return { offsetX, offsetY, renderW, renderH };
    }

    function sampleGateSignal(gate, frameData, w, h) {
      const dx = gate.p2.x - gate.p1.x;
      const dy = gate.p2.y - gate.p1.y;
      const len = Math.hypot(dx * w, dy * h) || 1;
      const nx = (-dy * h) / len;
      const ny = (dx * w) / len;

      const currentLuma = new Float32Array(SAMPLE_COUNT);
      let brokenPoints = 0;

      for (let i = 0; i < SAMPLE_COUNT; i++) {
        const t = i / (SAMPLE_COUNT - 1);
        const cx = (gate.p1.x + dx * t) * (w - 1);
        const cy = (gate.p1.y + dy * t) * (h - 1);

        let sumLuma = 0;
        let validSamples = 0;
        for (let offset = -1; offset <= 1; offset++) {
          const sx = Math.round(cx + nx * offset);
          const sy = Math.round(cy + ny * offset);
          if (sx >= 0 && sx < w && sy >= 0 && sy < h) {
            const idx = (sy * w + sx) * 4;
            sumLuma += 0.299 * frameData[idx] + 0.587 * frameData[idx + 1] + 0.114 * frameData[idx + 2];
            validSamples++;
          }
        }
        const luma = validSamples > 0 ? sumLuma / validSamples : 0;
        currentLuma[i] = luma;

        if (gate.bgLuma && Math.abs(luma - gate.bgLuma[i]) > lumaDeltaThreshold) {
          brokenPoints++;
        }
      }

      if (!gate.bgLuma) {
        gate.bgLuma = currentLuma;
        return 0;
      }

      const signalPct = (brokenPoints / SAMPLE_COUNT) * 100;

      if (signalPct < 4 && activeHandle === null) {
        const alpha = 0.03;
        for (let i = 0; i < SAMPLE_COUNT; i++) {
          gate.bgLuma[i] = gate.bgLuma[i] * (1 - alpha) + currentLuma[i] * alpha;
        }
      }

      return signalPct;
    }

    function getClockSeconds(videoMetaTime) {
      if (mode === 'live') {
        return performance.now() / 1000;
      } else {
        const factor = parseFloat(document.getElementById('fpsFactor').value) || 8;
        const rawT = typeof videoMetaTime === 'number' ? videoMetaTime : video.currentTime;
        return rawT / factor;
      }
    }

    function interpolateCrossingTime(prevT, currT, prevSig, currSig, threshold) {
      if (currSig <= prevSig || prevSig >= threshold) return currT;
      const fraction = (threshold - prevSig) / (currSig - prevSig);
      return prevT + Math.max(0, Math.min(1, fraction)) * (currT - prevT);
    }

    function recordTime(sec) {
      times.unshift(sec);
      const best = Math.min(...times);
      const list = document.getElementById('historyList');
      list.innerHTML = '';
      times.forEach((t, idx) => {
        const li = document.createElement('li');
        li.className = 'history-item';
        const isPB = t === best && times.length > 1;
        li.innerHTML = `
          <span>Lopp #${times.length - idx} ${isPB ? '<span class="pb-tag">PB</span>' : ''}</span>
          <strong>${t.toFixed(3)} s</strong>
        `;
        list.appendChild(li);
      });
    }

    function analyzeCurrentFrame(mediaTime) {
      if (video.readyState < 2 || video.videoWidth === 0) return;

      const w = procCanvas.width;
      const h = procCanvas.height;
      try {
        procCtx.drawImage(video, 0, 0, w, h);
      } catch (_) {
        return;
      }
      const frameData = procCtx.getImageData(0, 0, w, h).data;

      const startSig = sampleGateSignal(gates.start, frameData, w, h);
      const finishSig = sampleGateSignal(gates.finish, frameData, w, h);

      document.getElementById('startMeter').style.width = `${Math.min(100, startSig * 2.5)}%`;
      document.getElementById('finishMeter').style.width = `${Math.min(100, finishSig * 2.5)}%`;

      const nowClock = getClockSeconds(mediaTime);
      const nowWallMs = performance.now();

      frameTimestamps.push(nowWallMs);
      while (frameTimestamps.length > 0 && nowWallMs - frameTimestamps[0] > 1000) {
        frameTimestamps.shift();
      }
      document.getElementById('fpsInfo').textContent = `FPS: ${frameTimestamps.length}`;

      if (state === 'ARMED' && startSig >= triggerThresholdPct && (nowWallMs - lastTriggerWallMs > DEBOUNCE_MS)) {
        const exactStart = prevClockSec > 0
          ? interpolateCrossingTime(prevClockSec, nowClock, gates.start.prevSignal, startSig, triggerThresholdPct)
          : nowClock;

        startTimeSec = exactStart;
        state = 'RUNNING';
        lastTriggerWallMs = nowWallMs;
        gates.start.flashUntil = nowWallMs + 350;
        beep(960, 0.09);
        document.getElementById('stateLabel').textContent = 'Tidtagning pågår...';
      } else if (state === 'RUNNING') {
        const currentElapsed = Math.max(0, nowClock - startTimeSec);
        document.getElementById('timerDisplay').textContent = `${currentElapsed.toFixed(3)} s`;

        if (finishSig >= triggerThresholdPct && (nowWallMs - lastTriggerWallMs > DEBOUNCE_MS)) {
          const exactFinish = prevClockSec > 0
            ? interpolateCrossingTime(prevClockSec, nowClock, gates.finish.prevSignal, finishSig, triggerThresholdPct)
            : nowClock;

          const finalDuration = Math.max(0, exactFinish - startTimeSec);
          document.getElementById('timerDisplay').textContent = `${finalDuration.toFixed(3)} s`;
          state = 'FINISHED';
          lastTriggerWallMs = nowWallMs;
          gates.finish.flashUntil = nowWallMs + 500;
          beep(1380, 0.2);
          document.getElementById('stateLabel').textContent = 'Målgång registrerad';
          recordTime(finalDuration);
        }
      }

      gates.start.prevSignal = startSig;
      gates.finish.prevSignal = finishSig;
      prevClockSec = nowClock;
    }

    function drawOverlay() {
      const rect = canvas.parentElement.getBoundingClientRect();
      if (canvas.width !== rect.width || canvas.height !== rect.height) {
        canvas.width = rect.width;
        canvas.height = rect.height;
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const vp = getVideoViewportRect();
      const now = performance.now();

      drawGate(gates.start, vp, '#00e676', 'START', now < gates.start.flashUntil);
      drawGate(gates.finish, vp, '#ff3d57', 'MÅL', now < gates.finish.flashUntil);
    }

    function drawGate(gate, vp, color, label, isFlashing) {
      const x1 = vp.offsetX + gate.p1.x * vp.renderW;
      const y1 = vp.offsetY + gate.p1.y * vp.renderH;
      const x2 = vp.offsetX + gate.p2.x * vp.renderW;
      const y2 = vp.offsetY + gate.p2.y * vp.renderH;

      ctx.save();
      ctx.strokeStyle = isFlashing ? '#ffffff' : color;
      ctx.lineWidth = isFlashing ? 6 : 3.5;
      if (isFlashing) {
        ctx.shadowColor = color;
        ctx.shadowBlur = 16;
      }
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
      ctx.restore();

      [
        { x: x1, y: y1, tag: '1' },
        { x: x2, y: y2, tag: '2' }
      ].forEach(pt => {
        ctx.fillStyle = 'rgba(11, 14, 20, 0.85)';
        ctx.strokeStyle = color;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, 14, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#fff';
        ctx.font = 'bold 10px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(pt.tag, pt.x, pt.y);
      });

      const mx = (x1 + x2) / 2;
      const my = (y1 + y2) / 2;
      ctx.fillStyle = 'rgba(11, 14, 20, 0.85)';
      ctx.fillRect(mx - 24, my - 10, 48, 20);
      ctx.fillStyle = color;
      ctx.font = 'bold 11px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(label, mx, my);
    }

    // Touch / Mus-dragning
    function getPointerCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    canvas.addEventListener('pointerdown', (e) => {
      const ptr = getPointerCoords(e);
      const vp = getVideoViewportRect();
      let bestDist = 30;
      let chosen = null;

      ['start', 'finish'].forEach(gateKey => {
        ['p1', 'p2'].forEach(ptKey => {
          const pt = gates[gateKey][ptKey];
          const px = vp.offsetX + pt.x * vp.renderW;
          const py = vp.offsetY + pt.y * vp.renderH;
          const d = Math.hypot(ptr.x - px, ptr.y - py);
          if (d < bestDist) {
            bestDist = d;
            chosen = { gate: gateKey, point: ptKey };
          }
        });
      });

      if (chosen) {
        activeHandle = chosen;
        canvas.setPointerCapture(e.pointerId);
      }
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!activeHandle) return;
      const ptr = getPointerCoords(e);
      const vp = getVideoViewportRect();
      const normX = Math.min(0.98, Math.max(0.02, (ptr.x - vp.offsetX) / vp.renderW));
      const normY = Math.min(0.98, Math.max(0.02, (ptr.y - vp.offsetY) / vp.renderH));
      gates[activeHandle.gate][activeHandle.point] = { x: normX, y: normY };
      gates[activeHandle.gate].bgLuma = null;
    });

    const releaseHandle = () => {
      if (activeHandle) {
        gates[activeHandle.gate].bgLuma = null;
        activeHandle = null;
      }
    };
    canvas.addEventListener('pointerup', releaseHandle);
    canvas.addEventListener('pointercancel', releaseHandle);

    // Huvudloop för både rendering och analys
    function mainLoop() {
      drawOverlay();
      if (!video.paused && !video.ended) {
        analyzeCurrentFrame(video.currentTime);
      }
      requestAnimationFrame(mainLoop);
    }

    // Knappar
    document.getElementById('btnStartCamBig').addEventListener('click', startCamera);

    function armSystem() {
      resetBackgrounds();
      prevClockSec = 0;
      document.getElementById('timerDisplay').textContent = '0.000 s';
      state = 'ARMED';
      beep(660, 0.08);
      document.getElementById('stateLabel').textContent = 'Redo – Korsa START';
    }

    document.getElementById('btnArm').addEventListener('click', armSystem);
    document.getElementById('btnArmVideo').addEventListener('click', armSystem);

    const resetSystem = () => {
      state = 'IDLE';
      prevClockSec = 0;
      document.getElementById('timerDisplay').textContent = '0.000 s';
      document.getElementById('stateLabel').textContent = 'Nollställd';
    };
    document.getElementById('btnReset').addEventListener('click', resetSystem);
    document.getElementById('btnResetVideo').addEventListener('click', resetSystem);

    document.getElementById('btnSwitchCam').addEventListener('click', () => {
      facingMode = facingMode === 'environment' ? 'user' : 'environment';
      startCamera();
    });

    document.getElementById('btnSwapLines').addEventListener('click', () => {
      const tmpP1 = { ...gates.start.p1 };
      const tmpP2 = { ...gates.start.p2 };
      gates.start.p1 = { ...gates.finish.p1 };
      gates.start.p2 = { ...gates.finish.p2 };
      gates.finish.p1 = tmpP1;
      gates.finish.p2 = tmpP2;
      resetBackgrounds();
    });

    document.getElementById('btnRecalibrate').addEventListener('click', () => {
      resetBackgrounds();
      document.getElementById('stateLabel').textContent = 'Bakgrund låst';
    });

    document.getElementById('sensSlider').addEventListener('input', (e) => {
      triggerThresholdPct = parseInt(e.target.value, 10);
      document.getElementById('sensVal').textContent = `${triggerThresholdPct}%`;
    });

    document.getElementById('contrastSlider').addEventListener('input', (e) => {
      lumaDeltaThreshold = parseInt(e.target.value, 10);
      document.getElementById('contrastVal').textContent = lumaDeltaThreshold;
    });

    // Lägesväxling Live vs 240 fps Video
    document.getElementById('btnLiveMode').addEventListener('click', () => {
      mode = 'live';
      showError('');
      document.getElementById('btnLiveMode').classList.add('active');
      document.getElementById('btnVideoMode').classList.remove('active');
      document.getElementById('liveControls').classList.remove('hidden');
      document.getElementById('slowmoControls').classList.remove('visible');
      startPrompt.classList.remove('hidden');
    });

    document.getElementById('btnVideoMode').addEventListener('click', () => {
      mode = 'video';
      showError('');
      document.getElementById('btnVideoMode').classList.add('active');
      document.getElementById('btnLiveMode').classList.remove('active');
      document.getElementById('liveControls').classList.add('hidden');
      document.getElementById('slowmoControls').classList.add('visible');
      startPrompt.classList.add('hidden');

      if (currentStream) {
        currentStream.getTracks().forEach(t => t.stop());
        currentStream = null;
      }
      video.srcObject = null;
    });

    // Uppladdning & iOS-rendering av video
    const scrubber = document.getElementById('videoScrubber');
    const videoTimeLabel = document.getElementById('videoTimeLabel');

    document.getElementById('videoUpload').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      showError('');

      if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
      currentObjectUrl = URL.createObjectURL(file);

      video.srcObject = null;
      video.src = currentObjectUrl;
      video.muted = true;
      video.playsInline = true;
      video.load();

      video.onloadeddata = () => {
        // Tvinga iOS Safari att rita ut första bildrutan direkt
        video.currentTime = 0.01;
        resetBackgrounds();
        state = 'IDLE';
        document.getElementById('stateLabel').textContent = 'Video redo';
      };

      video.onerror = () => {
        showError('Kunde inte läsa videofilen. Testa att klippa/spara videon i Bilder-appen så den sparas som standard MP4/MOV.');
      };
    });

    video.addEventListener('timeupdate', () => {
      if (mode !== 'video' || !video.duration) return;
      scrubber.value = Math.round((video.currentTime / video.duration) * 1000);
      videoTimeLabel.textContent = `${video.currentTime.toFixed(2)} s`;
    });

    scrubber.addEventListener('input', () => {
      if (!video.duration) return;
      video.pause();
      video.currentTime = (scrubber.value / 1000) * video.duration;
      analyzeCurrentFrame(video.currentTime);
    });

    document.getElementById('btnPlayPause').addEventListener('click', () => {
      if (!video.src) return;
      if (video.paused) video.play();
      else video.pause();
    });

    document.getElementById('btnStepBack').addEventListener('click', () => {
      if (!video.src) return;
      video.pause();
      video.currentTime = Math.max(0, video.currentTime - (1 / 30));
      setTimeout(() => analyzeCurrentFrame(video.currentTime), 40);
    });

    document.getElementById('btnStepFwd').addEventListener('click', () => {
      if (!video.src) return;
      video.pause();
      video.currentTime = Math.min(video.duration || 0, video.currentTime + (1 / 30));
      setTimeout(() => analyzeCurrentFrame(video.currentTime), 40);
    });

    document.getElementById('btnCopyTimes').addEventListener('click', () => {
      if (!times.length) return;
      const text = times.map((t, i) => `Lopp ${times.length - i}: ${t.toFixed(3)} s`).join('\n');
      navigator.clipboard.writeText(text);
      alert('Tiderna har kopierats till urklipp!');
    });

    requestAnimationFrame(mainLoop);
  </script>
</body>
</html>
